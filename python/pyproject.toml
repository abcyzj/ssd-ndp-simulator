[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ndpsim-tools"
version = "0.4.5.dev15"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5", "referencing>=0.30,<1"]
description = "Metadata capture, independent CPU fitting and measured service tables"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
ndpsim = "ndpsim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ndpsim*"]

[tool.setuptools.package-data]
ndpsim = ["schemas/*.json", "sst/*.py"]
