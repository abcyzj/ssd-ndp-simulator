[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ndpsim-tools"
version = "0.4.5.dev2"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5", "referencing>=0.30,<1"]
description = "Static IR metadata capture and structural validation tools"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ndpsim*"]

[tool.setuptools.package-data]
ndpsim = ["schemas/*.json"]
